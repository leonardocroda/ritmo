<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#0B0F12; --surface:#121815; --raised:#1B241A; --deep:#273323;
    --border:#354039; --border-hover:#4A574E;
    --lime:#B7F36B; --on-lime:#182014;
    --text:#F5F7F2; --muted:#A1AAA9;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1080px; height:1350px; overflow:hidden }
  body {
    background:var(--night); color:var(--text);
    font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding:96px 88px 64px;
  }
  .eyebrow { color:var(--lime); font-size:24px; font-weight:700; letter-spacing:.14em; text-transform:uppercase }
  h1 { font-size:84px; font-weight:700; line-height:1.05; letter-spacing:-.02em; margin-top:26px }
  h1 .accent { color:var(--lime) }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:48px }
  .stat {
    background:var(--surface); border:1px solid var(--border); border-radius:24px;
    padding:30px 34px 26px;
  }
  .stat .v { font-size:76px; font-weight:700; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums }
  .stat .v.small { font-size:56px; padding-top:12px }
  .stat .l { font-size:24px; color:var(--muted); margin-top:12px }
  .stat .l b { color:var(--text); font-weight:600 }
  .stat.hero { border-color:var(--lime) }
  .stat.hero .v { color:var(--lime) }
  .note { margin-top:34px; font-size:25px; color:var(--muted); font-variant-numeric:tabular-nums }
  .footer { display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:44px }
  .wordmark { display:flex; align-items:center; gap:14px; font-size:28px; font-weight:700 }
  .wordmark .dot { width:13px; height:13px; border-radius:999px; background:var(--lime) }
  .pageno { font-size:24px; color:var(--muted); font-variant-numeric:tabular-nums }
</style>
</head>
<body>
  <div class="eyebrow">04 · Os números</div>
  <h1>11 dias. 1 pessoa.<br><span class="accent">1 agente.</span></h1>
  <div class="grid">
    <div class="stat"><div class="v">302</div><div class="l">commits <b>atômicos</b></div></div>
    <div class="stat"><div class="v">13.500</div><div class="l"><b>linhas de código</b></div></div>
    <div class="stat"><div class="v">612</div><div class="l"><b>testes</b> no Postgres</div></div>
    <div class="stat"><div class="v">23</div><div class="l">tabelas · <b>19 endpoints</b></div></div>
    <div class="stat"><div class="v">232</div><div class="l"><b>atividades</b> no primeiro sync</div></div>
    <div class="stat hero"><div class="v">US$ 0<span style="font-size:38px">/mês</span></div><div class="l"><b>Vercel + Render + Neon</b>, sem cartão</div></div>
  </div>
  <p class="note">Cada número contado no repositório — nada estimado.</p>
  <div class="footer">
    <div class="wordmark"><span class="dot"></span>Ritmo</div>
    <div class="pageno">05 / 10</div>
  </div>
</body>
</html>
