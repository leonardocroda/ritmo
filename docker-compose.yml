# Ritmo — stack local (AD-007: Postgres desde a v1)
# Uso: docker compose up -d            (stack completo)
#       docker compose up -d postgres  (só o banco, para dev com uvicorn --reload)
services:
  postgres:
    image: postgres:16
    container_name: ritmo-postgres
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ritmo
      POSTGRES_DB: ritmo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritmo -d ritmo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: ritmo-backend
    environment:
      DATABASE_URL: postgresql+psycopg://ritmo:ritmo@postgres:5432/ritmo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
