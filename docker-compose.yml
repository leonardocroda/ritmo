# Ritmo — stack local (AD-007: Postgres desde a v1)
# Uso: docker compose up -d            (stack completo)
#       docker compose up -d postgres  (só o banco, para dev com uvicorn --reload)
services:
  postgres:
    image: postgres:16
    container_name: ritmo-postgres
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ritmo
      POSTGRES_DB: ritmo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritmo -d ritmo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: ritmo-backend
    # `.env` local do backend (NVIDIA_API_KEY da avaliação, overrides de
    # LTHR/zonas etc.) — OPCIONAL: sem ele o stack sobe igual; presente,
    # as vars fluem para o container. `environment:` abaixo vence em
    # conflito (DATABASE_URL do compose aponta para o hostname `postgres`).
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ritmo:ritmo@postgres:5432/ritmo
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # AD-020: destino do rewrite same-origin — resolvido NO BUILD (o Next
        # materializa as rewrites no build output); hostname do serviço
        # backend na rede do compose
        BACKEND_URL: http://backend:8000
    container_name: ritmo-frontend
    environment:
      # Mesmo valor em runtime (idempotência — o standalone já saiu do build com ele)
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
