# Ritmo — stack local (AD-007: Postgres desde a v1)
# Uso: docker compose up -d            (stack completo)
#       docker compose up -d postgres  (só o banco, para dev com uvicorn --reload)
services:
  postgres:
    image: postgres:16
    container_name: ritmo-postgres
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ritmo
      POSTGRES_DB: ritmo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritmo -d ritmo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: ritmo-backend
    # `.env` local do backend (NVIDIA_API_KEY da avaliação, overrides de
    # LTHR/zonas etc.) — OPCIONAL: sem ele o stack sobe igual; presente,
    # as vars fluem para o container. `environment:` abaixo vence em
    # conflito (DATABASE_URL do compose aponta para o hostname `postgres`).
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ritmo:ritmo@postgres:5432/ritmo
      # Tokens do host montados dentro do container (SYNC-25) — no Windows
      # `~` não expande no compose, por isso USERPROFILE.
      GARMINTOKENS: /garminconnect
      TZ: America/Sao_Paulo
    volumes:
      - ${USERPROFILE}/.garminconnect:/garminconnect
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # O Next inlina NEXT_PUBLIC_* no build time — chega como build arg.
        # Default = IP da LAN (acesso pelo celular na rede; README §LAN).
        # Para sobrescrever: NEXT_PUBLIC_API_URL=... docker compose up -d --build frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.15.16:8000}
    container_name: ritmo-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
